{n:'Лиана',t:'Целительница лесов',r:4,bg:4,s:'leaf',a:'#18a558',b:'#c8f05a',d:'#0d5a30',ev:['Песнь','зелёных крон'],hair:0x35d07a,top:0xffffff,low:0x159a58},

 const p=el('div','pl'),g=el('div','gem','?');const mid=el('div','mid');mid.append(el('div','goal','Собери ровно 1 целый кристалл'),el('div','expr',pick.length?pick.map(s=>s.f.join('/')).join(' + ')+' = ?':'нажимай на осколки'));const row=el('div','shards');hand.forEach(s=>{const on=pick.includes(s),b=el('button','sh'+(on?' on':'')+(tips.includes(s.id)?' tip':''));b.type='button';b.dataset.id=s.id;b.setAttribute('aria-label',s.f.join(' из '));b.innerHTML=`<svg viewBox="0 0 84 92"><polygon points="42,2 80,30 66,88 18,88 4,30" fill="${h.a}" stroke="#fff" stroke-width="3"/><polygon points="42,2 80,30 42,44 4,30" fill="#ffffff44"/></svg><b>${s.f[0]}<i>${s.f[1]}</i></b>`;b.onclick=()=>{on?pick=pick.filter(x=>x!==s):pick.push(s);tone(on?400:620,.08);render()};row.append(b)});mid.append(row);
